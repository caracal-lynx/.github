name: Linear key guard
description: >-
  Fail a PR that carries a bare Linear issue key in a field the GitHub integration scans, unless
  the branch name claims that key. Prevents a citation being read as a claim of work.

# WHY A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW.
#
# A reusable workflow renames the check to `<caller-job> / <called-job>`. claude-context already
# requires the context `guard` in a repo ruleset, so switching it to a reusable workflow would
# silently stop the required check ever reporting and block every PR in that repo indefinitely -
# with no error, because a required check that never runs just sits pending. A composite action
# runs inside the caller's own job, so the check keeps whatever name the caller gave it and the
# existing ruleset keeps working untouched.
#
# THE RULE, in one line: a bare key is allowed only if the branch name declares it. See guard.sh
# for why that single rule fits both a code repo (where a branch key SHOULD drive the transition)
# and a docs repo (where no branch carries a key, so every bare key is a citation).
#
# `caracal-lynx/.github` is public, so callers need no token to resolve this action.

inputs:
  github-token:
    description: Token used to read the PR's commit messages. The caller's default is fine.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Proven firing before it is trusted, on every run rather than once at authoring time. This
    # is a shared action: a regex edit here reaches every repo at once, and the self-test is what
    # stands between that and a fleet of guards that silently pass everything.
    - name: Self-test the matcher
      shell: bash
      run: bash "${{ github.action_path }}/guard.sh" --self-test

    - name: Scan the four fields Linear reads
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Passed via env, never interpolated into the script: a PR title containing a backtick or
        # $( ) would otherwise be executed by the runner.
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        PR_NUM: ${{ github.event.pull_request.number }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/lkg-title.txt"
        printf '%s' "$PR_BODY"  > "$RUNNER_TEMP/lkg-body.txt"
        # Commit messages are the field the 2026-08-19 miss was hiding in: that PR's body had been
        # carefully spaced and its commit message had not, and it closed an unfinished issue.
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/commits" --paginate \
          --jq '.[].commit.message' > "$RUNNER_TEMP/lkg-commits.txt"
        bash "$ACTION_PATH/guard.sh" \
          "$RUNNER_TEMP/lkg-title.txt" "$RUNNER_TEMP/lkg-body.txt" "$PR_BRANCH" \
          "$RUNNER_TEMP/lkg-commits.txt"
