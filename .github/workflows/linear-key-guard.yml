name: Linear key guard

# This repo HOSTS the action, so it runs its own copy from the working tree rather than pinning a
# published SHA. That is the point: a PR editing `actions/linear-key-guard/` is checked by the
# EDITED guard, self-test included. A pinned SHA here would test the previous version and pass a
# broken change through to nine consumers — the fault class that made `renovate-health.yml` in
# `.github-private` adopt self-execution-on-merge for the same reason.
#
# Consumers do the opposite and pin a full SHA, because they want a version that has been seen to
# work rather than whatever is on this master right now.
#
# The rule, the evidence and the escape hatch live in the action's README.

on:
  pull_request:
    # `edited` is not optional: a PR body can be rewritten to add a key after a green run, and
    # nothing else re-triggers on that. The body is one of the four fields being protected.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard: # job id MUST stay `guard` — it is the check context a ruleset would require
    runs-on: ubuntu-latest
    steps:
      # Needed only because the `uses:` below is a local path. Consumers need no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/linear-key-guard
