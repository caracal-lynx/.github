name: Node Release

# Reusable release workflow for Caracal Lynx TypeScript/Node packages.
# Implements the Changesets PR-flow: push to main/master either opens
# a "Version Packages" PR, or — when that PR merges — publishes to npm
# via Trusted Publishing (OIDC, no NPM_TOKEN).
#
# Linear release sync (linear-release-action) is wired separately per
# consumer once DAG-58 (beta access) lands.
#
# Action-pinning policy (DAG-78):
#   - Third-party actions (pnpm/action-setup, changesets/action,
#     linear/linear-release-action) are pinned to a full commit SHA with a
#     `# vX.Y.Z` comment — defends against tag re-pointing;
#     Renovate reads the comment as the version hint and bumps both together.
#   - First-party actions/* (checkout, setup-node, create-github-app-token) are
#     GitHub-owned and kept on the major-version tag, Renovate-bumped weekly.

on:
  workflow_call:
    inputs:
      node-version:
        description: |
          Explicit Node.js version. Mutually exclusive with node-version-file — set
          exactly one. Deliberately has NO default: it used to default to "24.16.0",
          which meant a consumer that omitted it was silently pinned to a version
          that is below every current repo's engines.node floor. A version nobody
          chose is the wrong kind of default (DAG-12).
        type: string
        default: ""
      node-version-file:
        description: |
          Path to a file declaring the Node version — ".nvmrc", ".node-version", or
          "package.json". PREFERRED over node-version: it makes the repo's own file
          the single source of truth instead of a pin duplicated into every workflow
          that then drifts. sluice-client-eribe's CI ran 53 days below its own
          engines floor exactly that way. Mutually exclusive with node-version.
        type: string
        default: ""
      package-manager:
        description: Package manager — "npm" or "pnpm"
        type: string
        default: npm
      run-build:
        description: Run the build step before publishing. Set false for pure-config packages with no build/dist step. Tests always run. Mirrors node-ci's run-build (DAG-158).
        type: boolean
        default: true
      provenance:
        description: Emit npm provenance attestation. MUST be false for packages with publishConfig.access=restricted (npm rejects provenance on private packages and it would leak metadata to the public sigstore log).
        type: boolean
        default: true
      npm-read-auth:
        description: "DEPRECATED / no-op (DAG-162). Read auth is now always on: NODE_AUTH_TOKEN is supplied to every install/precheck step from the inherited NPM_READ_TOKEN, mirroring node-ci. Empty and harmless when the org has no such secret; the publish itself still uses OIDC Trusted Publishing. Retained only so existing callers that pass `npm-read-auth: true` don't break — safe to drop from your release.yml. See DAG-156 for the original rationale."
        type: boolean
        default: false
      release-commit-message:
        description: Commit message used by the changesets PR (house style is `[master] - ...`)
        type: string
        default: "[master] - chore(release): version packages"
      release-pr-title:
        description: Title of the auto-created release PR
        type: string
        default: "chore(release): version packages"
      sync-linear:
        description: "Sync the publish to a Linear release via linear-release-action. Opt-in — only fires on an actual publish, and requires the LINEAR_ACCESS_KEY org secret (inherited). See DAG-74."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one of node-version / node-version-file must be set
        # First step on purpose: fail before minting a token or touching the
        # registry. Unlike node-ci.yml there is no ci-success job to validate in,
        # and this workflow PUBLISHES — a run on an unintended Node version is not
        # something to discover afterwards. setup-node given neither input falls
        # back to whatever the runner ships and only warns.
        run: |
          v='${{ inputs.node-version }}'
          f='${{ inputs.node-version-file }}'
          if [ -z "$v" ] && [ -z "$f" ]; then
            echo "::error::Set node-version-file (preferred, e.g. .nvmrc) or node-version. Neither was supplied."
            exit 1
          fi
          if [ -n "$v" ] && [ -n "$f" ]; then
            echo "::error::node-version ('$v') and node-version-file ('$f') are mutually exclusive. setup-node would silently prefer node-version and ignore the file."
            exit 1
          fi
      - name: Check App token prerequisites
        id: preflight
        shell: bash
        run: |
          if [[ -n "$APP_ID" && -n "$PRIVATE_KEY" ]]; then
            echo "use_app_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_app_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASER_APP_ID or RELEASER_PRIVATE_KEY not configured — falling back to GITHUB_TOKEN. Release PRs may require manual approval before CI can run on them."
          fi
        env:
          APP_ID: ${{ vars.RELEASER_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Mint caracal-lynx-releaser App token
        id: app-token
        if: steps.preflight.outputs.use_app_token == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # required: changesets walks git history
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          # Authenticate installs so restricted @caracal-lynx/* deps resolve: pnpm's
          # minimumReleaseAge check does a registry GET that 404s unauthenticated and
          # fails the release. Unconditional, mirroring node-ci — empty/harmless when
          # the org has no NPM_READ_TOKEN. This was the DAG-162 release-only 404.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm build' || 'npm run build' }}

      - name: Test
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm test' || 'npm test' }}

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # Use `pnpm run <script>`, not `pnpm <script>`: `version` is a built-in
          # pnpm command (bump-the-version, needs a semver arg) so bare `pnpm version`
          # fails with ERR_PNPM_INVALID_VERSION_BUMP and never runs the package script.
          # `release` is not reserved, but keep it symmetric for safety.
          # changesets/action v2 renamed every one of these (publish -> publish-script,
          # version -> version-script, commit -> commit-message, title -> pr-title).
          # Passing the v1 names does not warn — the action hard-fails with
          # "The following inputs have been renamed", so a release cannot run at all.
          publish-script: ${{ inputs.package-manager == 'pnpm' && 'pnpm run release' || 'npm run release' }}
          version-script: ${{ inputs.package-manager == 'pnpm' && 'pnpm run version' || 'npm run version' }}
          commit-message: ${{ inputs.release-commit-message }}
          pr-title: ${{ inputs.release-pr-title }}
          # v2 takes the token as an INPUT and refuses to run when a GITHUB_TOKEN
          # env var is also set and differs from it:
          #   "The GITHUB_TOKEN environment variable is set and does not match the
          #    github-token input."
          # Under v1 the env var was the only channel. It must now be passed here and
          # NOT in env below, or the App token and the action's default github.token
          # disagree and the action hard-fails. The App token is what lets the release
          # PR trigger CI — github.token deliberately cannot.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
        env:
          NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
          # A READ token so changesets' `npm info` precheck can see existing versions
          # of a restricted package (unauthenticated reads 404 → changesets thinks the
          # version is unpublished and crashes). Unconditional, mirroring node-ci; empty
          # and harmless for public packages. This is NOT publish auth — npm prefers OIDC
          # Trusted Publishing over a configured token, so the publish still goes via
          # OIDC. See DAG-156, DAG-162.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          # Publish authentication via npm Trusted Publishing (OIDC).
          # NO publish NPM_TOKEN — Classic Automation tokens were retired in Nov 2025;
          # Trusted Publishing is the recommended path for CI publishing.
          # Each package must configure Trusted Publishers at
          # npmjs.com/package/<name>/access to authorise this workflow by
          # org + repo + filename. The `id-token: write` permission above
          # provides the OIDC token at publish time.

      # Sync the publish to a Linear release: creates/updates a Linear release and
      # links the issues referenced in this release's commit range / PR descriptions.
      # Opt-in (sync-linear), and ONLY on an actual publish — a run that just opens
      # or updates the Version Packages PR has published != 'true', so this is
      # skipped and no spurious release is created. The full git history needed to
      # walk the commit range is already present (checkout fetch-depth: 0 above).
      # See DAG-74.
      - name: Sync release to Linear
        if: ${{ inputs.sync-linear && steps.changesets.outputs.published == 'true' }}
        uses: linear/linear-release-action@e1ca7cace602cb66768264790a2b316630877148 # v0.17.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          # Name the Linear release after the published version (else it's "no version
          # set" — confirmed via DAG-74 dry-run). publishedPackages is non-empty here:
          # the step only runs on a real publish. First package's version is used.
          # v2 renamed the outputs too: publishedPackages -> published-packages
          # (also hasChangesets -> has-changesets, pullRequestNumber -> pr-number, neither
          # used here). `published` kept its name. An unrenamed output resolves to an
          # empty string, so fromJSON('') would fail this step AFTER a successful publish.
          # BRACKET syntax is mandatory: in a GitHub expression `outputs.published-packages`
          # parses the hyphen as SUBTRACTION, not as part of the property name.
          version: ${{ fromJSON(steps.changesets.outputs['published-packages'])[0].version }}
