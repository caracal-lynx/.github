name: Smoke

# Runs this repo's OWN reusable workflows against the fixture package at the root.
#
# Why (DAG-326): node-ci.yml and node-release.yml are consumed by the whole fleet and
# were, until now, never executed here. A change to either was unverifiable in the repo
# that owns it — the first execution happened in a consumer, and for node-release.yml
# that means on the publish path. changesets/action v2 (#46, 13 Aug) renamed its entire
# input surface; nothing here noticed until data-gubbins' Release broke on 21 Aug.
#
# Nothing is published. The fixture's `release` script is an echo, so changesets/action
# is invoked in full — token handling, input names, the whole call contract — but the
# publish itself is a no-op.
#
# ponytail: pnpm only. Both Node consumers in the fleet (data-gubbins,
# sluice-client-eribe) use pnpm, so the `npm` branch of these workflows is still
# unexercised. Add a second pair of jobs with package-manager: npm if a consumer
# ever adopts it.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# No workflow-level permissions block. A called workflow's `permissions:` cannot
# grant more than the caller's token already has, so a blanket `contents: read`
# here caps node-release.yml's `id-token: write` at `none` and the run fails at
# startup before a single step executes. Each job declares its own instead.

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # No display `name:` here. The check CONTEXT is built from the job's display name
    # when one is set, and from the job id otherwise — so `name: node-ci.yml` produced
    # the context `node-ci.yml / CI success`. Without it the context is
    # `ci / CI success`, which is the string consumers gate their own rulesets on and
    # the one DAG-328's ruleset requires. A ruleset requiring a context that never
    # reports blocks every PR indefinitely with nothing on the page to say why.
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version-file: .nvmrc
      # ubuntu only: the fixture's scripts are echoes, so a Windows leg would bill the
      # x2 multiplier to prove nothing. Consumers keep their own matrix (DAG-263).
      os-matrix: '["ubuntu-latest"]'
      package-manager: pnpm
      coverage: true
      run-format-check: true
      # On so the changeset-required job actually runs. It holds the largest block of
      # untested logic in node-ci.yml — ~100 lines of embedded bash + node that diffs
      # the published fields of every changed manifest. It cannot FAIL here (the
      # fixture is `private: true`, so the surface check skips it, and no path matches
      # '^src/'), but executing it catches a syntax error or a Node incompatibility in
      # that script, which skipping it does not.
      # ponytail: exercises the script, does not assert its verdict. Asserting would
      # need a fixture PR engineered to owe a changeset — a test harness for a test.
      require-changeset: true
      # require-dist left at its default (true) so the dist assertion is exercised —
      # the fixture's build script writes dist/smoke.txt for exactly that reason.

  release:
    # Job id `release` forms the `release / Release` context — see the note above.
    # Mirrors node-release.yml's own block exactly — it is the ceiling, not a grant.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/node-release.yml
    with:
      node-version-file: .nvmrc
      package-manager: pnpm
      # Restricted-package setting; the fixture is private and nothing reaches npm
      # either way, but provenance on a private package is the wrong default to model.
      provenance: false
      # sync-linear stays false. It gates on `published == 'true'`, which the echo
      # release script never produces, so the step is skipped and its expression is
      # never evaluated. That is this smoke test's known ceiling: it catches breaks
      # that hard-fail changesets/action (renamed inputs, token conflicts), NOT ones
      # that live in the skipped Linear-sync step (renamed outputs, hyphen-vs-minus
      # in `outputs['published-packages']`). Closing that gap needs a real publish.
      sync-linear: false
    secrets: inherit
