name: Node CI

# Reusable CI workflow for Caracal Lynx TypeScript/Node packages.
# Consumer-facing inputs are documented below; see ../../README.md for usage.
#
# Action-pinning policy (DAG-78):
#   - Third-party actions (pnpm/action-setup, changesets/action) are pinned to a
#     full commit SHA with a `# vX.Y.Z` comment — defends against tag re-pointing;
#     Renovate reads the comment as the version hint and bumps both together.
#   - First-party actions/* (checkout, setup-node, upload-artifact,
#     create-github-app-token) are GitHub-owned and kept on the major-version tag,
#     Renovate-bumped weekly. Lower supply-chain risk; tag churn not worth it.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (matches package.json engines.node lower bound)
        type: string
        default: "24.16.0"
      os-matrix:
        description: JSON array of runner OS labels for the test matrix
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      package-manager:
        description: Package manager — "npm" or "pnpm"
        type: string
        default: npm
      coverage:
        description: Generate coverage report (uploads as artifact)
        type: boolean
        default: false
      run-lint:
        description: Run the lint job. Set false for repos with no lint script (e.g. empty stubs / placeholder repos).
        type: boolean
        default: true
      run-build:
        description: Run the build job. Set false for config-driven app repos with no build/dist step.
        type: boolean
        default: true
      run-typecheck:
        description: Run the typecheck job. Set false for repos with no typecheck script (e.g. pure-config packages).
        type: boolean
        default: true
      run-test:
        description: Run the test job. Set false for repos with no test suite.
        type: boolean
        default: true
      require-changeset:
        description: Require a Changesets entry on PRs that modify src/. Set true for published libraries. See DAG-63.
        type: boolean
        default: false
      require-dist:
        description: >-
          Assert a non-empty root dist/ after the build. Set false for workspace monorepos, where the
          build output lives under each package rather than at the root. Only takes effect when
          run-build is true.
        type: boolean
        default: true
      changed-paths-pattern:
        description: >-
          ERE matched against changed file paths to decide whether the changeset gate fires. Default
          '^src/' suits a single-package repo whose root IS the package. A workspace monorepo passes
          something like '^(packages|tools)/[^/]+/(src/|package\.json)'.
        type: string
        default: '^src/'
    secrets:
      NPM_READ_TOKEN:
        required: false
        description: npm granular read token for installing restricted @caracal-lynx packages. Optional — public-only repos do not need it.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Run lint
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm lint' || 'npm run lint' }}

  typecheck:
    name: Typecheck
    if: ${{ inputs.run-typecheck }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Run typecheck
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm typecheck' || 'npm run typecheck' }}

  test:
    name: Test (${{ matrix.os }})
    if: ${{ inputs.run-test }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Run tests
        run: ${{ inputs.coverage && (inputs.package-manager == 'pnpm' && 'pnpm test:cov' || 'npm run test:cov') || (inputs.package-manager == 'pnpm' && 'pnpm test' || 'npm test') }}
      - name: Upload coverage
        if: inputs.coverage && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    if: ${{ inputs.run-build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Build
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm build' || 'npm run build' }}
      - name: Assert dist is non-empty
        # Skipped for workspace monorepos (require-dist: false) — their build output lives under
        # each package, so a root dist/ never exists and this would fail every run.
        if: ${{ inputs.require-dist }}
        shell: bash
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ is empty or missing after build"
            exit 1
          fi
          echo "dist/ contents: $(find dist -type f | wc -l) files"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      # No cache on this job: it runs only `audit` (no install), so there is no
      # package-manager store to cache. With pnpm the setup-node cache-save step
      # then errors on a cold store ("Path Validation Error") and fails the job.
      # See DAG-141.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: npm audit — production dependencies (blocking)
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm audit --prod --audit-level=high' || 'npm audit --omit=dev --audit-level=high' }}
      - name: npm audit — full dependency tree (report-only, non-blocking)
        # Dev/build-tool CVEs are surfaced here for visibility (and tracked by
        # Renovate vulnerabilityAlerts) but do NOT block releases — only vulns
        # in shipped/production deps gate. See DAG-67.
        if: always()
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm audit --audit-level=high || true' || 'npm audit --audit-level=high || true' }}

  changeset-required:
    name: Changeset required
    # Gates src/ changes on a Changesets entry for published libraries. Skipped
    # unless the consumer sets require-changeset: true. See DAG-63.
    if: ${{ inputs.require-changeset && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Verify a changeset is present when the published surface changes
        shell: bash
        env:
          PM: ${{ inputs.package-manager }}
          BASE: ${{ github.base_ref }}
          CHANGED_PATHS_PATTERN: ${{ inputs.changed-paths-pattern }}
        run: |
          REASONS=()

          # 1. Code. The original trigger (DAG-76).
          # Path pattern is caller-supplied (changed-paths-pattern) so a workspace monorepo can
          # match packages/<name>/src/ instead of a root src/. Default '^src/' is unchanged, so
          # every existing consumer behaves byte-identically.
          if git diff --name-only "origin/${BASE}...HEAD" | grep -qE "${CHANGED_PATHS_PATTERN}"; then
            REASONS+=("changed paths matched ${CHANGED_PATHS_PATTERN}")
          fi

          # 2. Contract. src/ is not the boundary of what gets published:
          # package.json carries consumer-visible surface that a src/-only check
          # cannot see. A peerDependencies widening with no changeset shipped
          # nothing to npm twice — 2026-05-24 (sluice-enrich #54/#55, broke
          # sluice-client-eribe's install) and 2026-07-28 (sluice-enrich #123).
          #
          # Diff *fields*, not the file: devDependencies/scripts/version are not
          # consumer-visible, and triggering on them would demand a changeset for
          # every Renovate devDependency bump across the fleet. (DAG-31)
          #
          # Root package.json only. Every published package in the fleet is a
          # repo root; revisit if a true multi-package workspace ever ships.
          #
          # node, not jq: setup-node has already run, so node is guaranteed here,
          # whereas jq is only an incidental ubuntu-latest convenience. Keys are
          # sorted recursively so a pure reordering of dependencies does not fire.
          # `dependencies` is deliberately NOT in this list. Measured against 186
          # package.json commits across the five gated repos: including it fires
          # on 67 (36%), excluding it on 18 (10%). The extra 49 are almost all
          # Renovate prod-dep bumps — bot PRs no human will hand-write a changeset
          # for, which would sit red until someone bypasses the gate. A gate that
          # routine traffic teaches you to bypass is worse than no gate. Revisit
          # if Renovate ever generates changesets itself (postUpgradeTasks).
          cat > "${RUNNER_TEMP:-/tmp}/pkg-surface.js" <<'SURFACE'
          const KEYS = ["peerDependencies", "optionalDependencies",
                        "exports", "main", "types", "bin", "files"];
          const sort = (v) =>
            Array.isArray(v) ? v.map(sort)
            : v && typeof v === "object"
              ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sort(v[k])]))
              : v;
          let pkg = {};
          try { pkg = JSON.parse(require("fs").readFileSync(0, "utf8")); } catch {}
          const surface = Object.fromEntries(KEYS.map((k) => [k, pkg[k] ?? null]));
          // engines.node only, not all of engines. npm enforces engines.node on
          // install, so raising the floor is consumer-visible. engines.pnpm (and
          // packageManager) are dev-workflow pins that Renovate bumps constantly
          // and that nobody installing the published tarball ever sees — gating
          // on them would demand a changeset for every pnpm bump in the fleet.
          surface["engines.node"] = pkg.engines?.node ?? null;
          console.log(JSON.stringify(sort(surface), null, 2));
          SURFACE

          SURFACE_JS="${RUNNER_TEMP:-/tmp}/pkg-surface.js"
          # Empty stdin (no package.json on base, e.g. a brand-new repo) yields
          # all-nulls rather than crashing the step.
          before=$(git show "origin/${BASE}:package.json" 2>/dev/null | node "$SURFACE_JS" || true)
          after=$(node "$SURFACE_JS" < package.json)

          if [ "$before" != "$after" ]; then
            REASONS+=("published package.json fields changed")
            echo "::group::Changed published fields"
            diff <(echo "$before") <(echo "$after") || true
            echo "::endgroup::"
          fi

          if [ ${#REASONS[@]} -eq 0 ]; then
            echo "No matching path or published-surface changes — changeset not required."
            exit 0
          fi

          printf '%s\n' "$(IFS=', '; echo "${REASONS[*]}") — a changeset is required."
          if [ "$PM" = "pnpm" ]; then
            pnpm exec changeset status --since="origin/${BASE}" --verbose
          else
            npx --no-install changeset status --since="origin/${BASE}" --verbose
          fi

  ci-success:
    name: CI success
    # Single stable status check for branch-protection rulesets: green only when
    # every CI job above succeeded. Lets org rulesets require one context
    # ("ci / CI success") instead of brittle per-job/matrix names. See DAG-67.
    if: always()
    needs: [lint, typecheck, test, build, security, changeset-required]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
